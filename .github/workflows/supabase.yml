name: Deploy Supabase (database + password email function)

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RESET_FROM_EMAIL: ${{ secrets.RESET_FROM_EMAIL }}
      PROJECT_REF: zxqpcuncbpzxsaqmfcby
    steps:
      - uses: actions/checkout@v4

      - name: Check GitHub secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -z "$RESEND_API_KEY" ] && { [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ]; }; then
            missing="$missing GMAIL_USER+GMAIL_APP_PASSWORD(or RESEND_API_KEY)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (Settings → Secrets and variables → Actions). See PASSWORD_RESET_SETUP.md"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Apply database changes (adds email column, keeps all students and progress)
        run: |
          # Runs the SQL through Supabase's Management API (HTTPS), so no database password
          # or IPv6 connection is needed. The SQL only uses "if not exists", so re-running is safe.
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            jq -Rs '{query: .}' "$f" > /tmp/body.json
            status=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data @/tmp/body.json)
            cat /tmp/resp.txt; echo
            if [ "$status" -ge 300 ]; then echo "::error::Database update failed (HTTP $status)"; exit 1; fi
          done

      - name: Save email settings in Supabase
        run: |
          args=()
          [ -n "$RESEND_API_KEY" ] && args+=("RESEND_API_KEY=$RESEND_API_KEY")
          [ -n "$RESET_FROM_EMAIL" ] && args+=("RESET_FROM_EMAIL=$RESET_FROM_EMAIL")
          [ -n "$GMAIL_USER" ] && args+=("GMAIL_USER=$GMAIL_USER")
          [ -n "$GMAIL_APP_PASSWORD" ] && args+=("GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD")
          supabase secrets set "${args[@]}" --remote="$PROJECT_REF" --yes

      - name: Deploy password-reset function
        run: supabase functions deploy password-reset --use-api --remote="$PROJECT_REF" --yes
