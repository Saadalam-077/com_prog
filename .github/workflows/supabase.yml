name: Deploy Supabase (database + password email function)

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESET_FROM_EMAIL: ${{ secrets.RESET_FROM_EMAIL }}
      PROJECT_REF: zxqpcuncbpzxsaqmfcby
    steps:
      - uses: actions/checkout@v4

      - name: Check GitHub secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$RESEND_API_KEY" ] && missing="$missing RESEND_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing (Settings → Secrets and variables → Actions). See PASSWORD_RESET_SETUP.md"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Link project
        run: supabase link "$PROJECT_REF" --yes

      - name: Apply database changes (adds email column, keeps all students and progress)
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --include-all --yes

      - name: Save email settings in Supabase
        run: |
          if [ -n "$RESET_FROM_EMAIL" ]; then
            supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" RESET_FROM_EMAIL="$RESET_FROM_EMAIL" --yes
          else
            supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" --yes
          fi

      - name: Deploy password-reset function
        run: supabase functions deploy password-reset --use-api --yes
